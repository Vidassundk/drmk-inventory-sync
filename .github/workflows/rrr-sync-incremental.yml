# Pulls parts changed on RRR since the last run into the mirror, and queues their new photos.
name: rrr-sync-incremental

# Started on schedule by apps/scheduler, because GitHub's own `schedule:` drops most runs.
on:
  workflow_dispatch:

# Shared with rrr-sync-full: both take the same lock, so they queue instead of failing.
concurrency:
  group: rrr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter worker...
      - run: pnpm sync:incremental
        env:
          RRR_BASE_URL: https://api.rrr.lt/
          RRR_USERNAME: ${{ secrets.RRR_USERNAME }}
          RRR_PASSWORD: ${{ secrets.RRR_PASSWORD }}
          RRR_USER_TOKEN: ${{ secrets.RRR_USER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Its own step, so a car failure can't undo the parts sync above.
      - run: pnpm sync:cars
        env:
          RRR_BASE_URL: https://api.rrr.lt/
          RRR_USERNAME: ${{ secrets.RRR_USERNAME }}
          RRR_PASSWORD: ${{ secrets.RRR_PASSWORD }}
          RRR_USER_TOKEN: ${{ secrets.RRR_USER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
